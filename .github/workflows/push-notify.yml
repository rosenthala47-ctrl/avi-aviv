name: push-notify

# שולח התראות פוש (התפנה תור / תור חדש) לאפליקציה סגורה.
# רץ כל 5 דקות, וגם ניתן להריץ ידנית מלשונית Actions (Run workflow).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      shop_filter:
        description: "מזהה מספרה יחידה לבדיקה (למשל try) — ריק = כל המספרות, כרגיל"
        required: false
        default: ""

concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund

      - name: Send pending push notifications
        working-directory: .github/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # השעות במסד הן זמן מקומי של המספרה — הראנר חייב לרוץ באותו אזור זמן
          TZ: Asia/Jerusalem
          # ריק בהרצה המתוזמנת הרגילה (אין inputs לאירוע schedule) — כל המספרות כרגיל
          SHOP_FILTER: ${{ github.event.inputs.shop_filter }}
          # הכנה ל-SMS (ראו sendSms ב-send-push.js): ריק כרגע — עד שתוגדר secret
          # בשם SMS_API_KEY (Settings → Secrets → Actions), הקוד רק מדפיס דמה
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
        run: node send-push.js
