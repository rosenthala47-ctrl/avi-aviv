name: deploy-hosting

# פרסום אוטומטי של האתר ל-Firebase Hosting בכל דחיפה ל-main.
# משתמש בסוד FIREBASE_TOKEN (נוצר ע״י firebase login:ci ונשמר ב-GitHub Secrets).
# אפשר גם להריץ ידנית מלשונית Actions → Run workflow.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting (BarberTor)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project barbertor --token "$FIREBASE_TOKEN" --non-interactive

      # ממשיכים לפרסם גם לכתובת הישנה כדי שהקישור הקיים של אורי יישאר מעודכן
      - name: Deploy to Firebase Hosting (legacy ori-grushko link)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project ori-grushko --token "$FIREBASE_TOKEN" --non-interactive
