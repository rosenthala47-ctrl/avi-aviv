<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>BarberTor — תורים לספרים</title>
  <meta name="description" content="BarberTor — מערכת תורים לספרים. פתחו מערכת משלכם, נהלו יומן ותזכורות, וקבלו קישור אישי ללקוחות." />

  <meta name="theme-color" content="#0a0c10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BarberTor" />

  <link rel="manifest" href="manifest.json" id="ug-manifest" />
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/icon-192.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BarberTor — תורים לספרים" />
  <meta property="og:description" content="פתחו מערכת תורים משלכם · יומן זמינות בזמן אמת · תזכורת לפני התור · קישור אישי ללקוחות" />
  <meta property="og:locale" content="he_IL" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- טעינה לא-חוסמת של גופן Heebo: הדפדפן שם media="print" בזמן ההורדה כדי שלא לחסום צביעה,
       ומחליף ל-"all" ברגע שהקובץ מוכן. פונטים של המערכת מוצגים ב-פרק הזמן הקצר של ההורדה. -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
  <script>try { document.documentElement.setAttribute("data-theme", localStorage.getItem("ug_theme") || "dark"); } catch (e) {}</script>
  <link rel="stylesheet" href="assets/styles.css?v=112" />
</head>
<body>
  <div class="app">
    <div id="root"></div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <div class="modal-back" id="modalBack">
    <div class="modal" id="modal"></div>
  </div>

  <!-- הגדרות. defer שומר על סדר הריצה אבל לא חוסם parsing של ה-HTML. -->
  <script src="config.js?v=112" defer></script>
  <!-- לוגיקה -->
  <script src="assets/js/util.js?v=112" defer></script>
  <script src="assets/js/store.js?v=112" defer></script>
  <script src="assets/js/auth.js?v=112" defer></script>
  <script src="assets/js/notify.js?v=112" defer></script>
  <script src="assets/js/fcm.js?v=112" defer></script>
  <script src="assets/js/email.js?v=112" defer></script>
  <script src="assets/js/app.js?v=112" defer></script>
  <!-- qrcode.js (~57KB) נטען רק כשצריך אותו — בעמוד "פרסום" של הבעלים. -->
  <script>
    (function(){
      window.UG = window.UG || {};
      var loading = null;
      UG.loadQrCode = function(){
        if (typeof qrcode !== "undefined") return Promise.resolve();
        if (loading) return loading;
        loading = new Promise(function(res, rej){
          var s = document.createElement("script");
          s.src = "assets/js/qrcode.js?v=99";
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
        return loading;
      };
    })();
  </script>
</body>
</html>
