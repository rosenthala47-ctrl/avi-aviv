  <!-- טעינה לא-חוסמת של גופן Heebo: הדפדפן שם media="print" בזמן ההורדה כדי שלא לחסום צביעה,
       ומחליף ל-"all" ברגע שהקובץ מוכן. פונטים של המערכת מוצגים ב-פרק הזמן הקצר של ההורדה. -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
  <script>try { document.documentElement.setAttribute("data-theme", localStorage.getItem("ug_theme") || "dark"); } catch (e) {}</script>
  <link rel="stylesheet" href="assets/styles.css?v=138" />
</head>
<body>
  <div class="app">
    <div id="root"></div>
  </div>

  <!-- רשת ביטחון + אבחון: רץ גם כשהאפליקציה תקועה. תופס שגיאות, ואם המסך
       נשאר ריק — מציג כפתור "איפוס מלא" (מנקה SW+מטמון) + מידע אבחון. אינו נוגע
       ברצף הטעינה; renderNow מבטל את הטיימר ברגע שמשהו מוצג בהצלחה. -->
  <script>
    (function () {
      window.__ugTrace = [];
      window.__ugMark = function (m) { try { window.__ugTrace.push(m + " @" + Math.round(performance.now()) + "ms"); } catch (e) {} };
      window.__ugMark("html");
      window.__ugErr = [];
      window.addEventListener("error", function (ev) {
        try { window.__ugErr.push("ERR: " + (ev.message || "") + " @" + ((ev.filename || "").split("/").pop()) + ":" + (ev.lineno || "")); } catch (e) {}
      });
      window.addEventListener("unhandledrejection", function (ev) {
        try { var r = ev.reason; window.__ugErr.push("REJECT: " + ((r && (r.message || r.code)) || r || "")); } catch (e) {}
      });

      // מעקב אחר טעינת כל קובץ סקריפט. onerror על תגית הסקריפט תופס כשל-רשת
      // (בניגוד ל-window.onerror שלא תופס כשלי טעינת משאבים) — כך נדע בוודאות
      // איזה קובץ לא נטען, וגם נדע מה לטעון מחדש בהתאוששות.
      window.__ugLoadState = {};
      window.__ugLoaded = function (n) {
        window.__ugLoadState[n] = "ok"; window.__ugMark("load:" + n);
        // app.js "נטען" אבל האתחול לא רץ תוך רגע? (למשל SW ישן שהגיש HTML במקום
        // קוד) — מפעילים התאוששות מהר, בלי לחכות לטיימר.
        if (n === "app") setTimeout(function () { if (!window.__ugBooted) ugRecover(); }, 250);
      };
      window.__ugFailed = function (n) {
        window.__ugLoadState[n] = "fail"; window.__ugMark("FAIL:" + n);
        try { window.__ugErr.push("LOAD-FAIL: " + n); } catch (e) {}
        // app.js נכשל בהורדה — מתחילים התאוששות מיד (במקום להמתין 6 שניות).
        if (n === "app") ugRecover();
      };

      function fullReset() {
        var done = function () { location.reload(true); };
        try {
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}));
          }
          Promise.all(jobs).then(done, done);
          setTimeout(done, 2500);   // ביטחון — לא להישאר תקוע גם אם הניקוי נתקע
        } catch (e) { done(); }
      }
      window.__ugFullReset = fullReset;

      // רשת התאוששות: אם האפליקציה לא עלתה תוך זמן קצר (למשל app.js לא נטען
      // בגלל תקלת רשת חולפת), טוענים מחדש את הסקריפטים שנכשלו ומריצים אתחול.
      // כל טעינה מחדש מוגנת מפני ריצה כפולה (ראו __ugAppInit ב-app.js).
      window.__ugRecoverTries = 0;
      window.__ugRecovering = false;
      var UG_FILES = [
        ["config", "config.js"], ["util", "assets/js/util.js"], ["store", "assets/js/store.js"],
        ["auth", "assets/js/auth.js"], ["notify", "assets/js/notify.js"], ["fcm", "assets/js/fcm.js"],
        ["email", "assets/js/email.js"], ["app", "assets/js/app.js"]
      ];
      // הגרסה נלקחת מתגית app.js עצמה — כדי שהטעינה החוזרת תמיד תבקש את הגרסה הנוכחית.
      function ugVer() {
        try { var s = document.querySelector('script[src*="app.js?v="]'); var m = s && s.src.match(/[?&]v=(\d+)/); return m ? m[1] : ""; }
        catch (e) { return ""; }
      }
      function ugRecover() {
        if (window.__ugBooted || window.__ugRecovering) return;
        if (window.__ugRecoverTries >= 3) return;
        window.__ugRecovering = true;
        window.__ugRecoverTries++;
        window.__ugMark("recover#" + window.__ugRecoverTries);
        var v = ugVer();
        // טוענים מחדש (עם עקיפת מטמון) את הקבצים שלא נטענו — ותמיד את app.js, כי
        // אם עדיין לא אותחל סימן שהוא לא רץ (גם אם "נטען" — למשל SW ישן שהגיש HTML).
        var chain = Promise.resolve();
        UG_FILES.forEach(function (f) {
          if (f[0] !== "app" && window.__ugLoadState[f[0]] === "ok") return;
          chain = chain.then(function () {
            if (window.__ugBooted) return;
            return new Promise(function (res) {
              var s = document.createElement("script");
              s.src = f[1] + "?v=" + v + "&r=" + Date.now();   // עוקף מטמון ו-SW ישן
              s.onload = function () { window.__ugLoadState[f[0]] = "ok"; window.__ugMark("re:" + f[0]); res(); };
              s.onerror = function () { window.__ugLoadState[f[0]] = "fail"; window.__ugMark("reFAIL:" + f[0]); res(); };
              document.body.appendChild(s);
            });
          });
        });
        chain.then(function () {
          if (window.__ugBoot && !window.__ugBooted) { try { window.__ugBoot(); } catch (e) {} }
          window.__ugRecovering = false;
          if (!window.__ugBooted) setTimeout(ugRecover, 4000);   // ניסיון נוסף אם עדיין לא עלה
        });
      }
      // הפעלות מהירות: מיד כשמשהו נכשל (דרך __ugFailed), וגם קצת אחרי שה-DOM מוכן
      // (מכסה מצב שבו app.js "נטען" אך לא אותחל), ורשת ביטחון מוחלטת אחרי 3.5 שניות.
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () { if (!window.__ugBooted) ugRecover(); }, 500);
      });
      setTimeout(function () { if (!window.__ugBooted) ugRecover(); }, 3500);

      window.__ugBootFail = setTimeout(function () {
        var r = document.getElementById("root");
        if (!r || r.children.length > 0) return;
        var diag = [
          "UG=" + (typeof window.UG),
          "Store=" + (window.UG && typeof window.UG.Store),
          "CONFIG=" + (typeof window.UG_CONFIG),
          "firebase=" + (typeof window.firebase),
          "online=" + (navigator.onLine),
          "sw=" + (navigator.serviceWorker && navigator.serviceWorker.controller ? "yes" : "no"),
          "load=" + JSON.stringify(window.__ugLoadState || {}),
          "recover=" + window.__ugRecoverTries,
          "trace=[" + (window.__ugTrace || []).join(" | ") + "]",
          "err=[" + (window.__ugErr || []).join(" ; ") + "]"
        ].join("\n");
        r.innerHTML =
          '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;' +
          'justify-content:center;gap:14px;font-family:Heebo,system-ui,sans-serif;color:#e8edf4;background:#0a0c10;' +
          'padding:22px;text-align:center">' +
          '<div style="font-size:34px">💈</div>' +
          '<div style="font-size:15px;opacity:.9">הטעינה נתקעה. נסו איפוס מלא:</div>' +
          '<button onclick="window.__ugFullReset()" style="background:#38bdf8;color:#04121f;border:none;' +
          'border-radius:12px;padding:13px 30px;font-size:16px;font-weight:800;cursor:pointer">איפוס מלא ופתיחה מחדש</button>' +
          '<button onclick="location.reload(true)" style="background:transparent;color:#9aa6b5;border:1px solid #232a35;' +
          'border-radius:12px;padding:9px 22px;font-size:14px;cursor:pointer">רענון רגיל</button>' +
          '<pre style="margin-top:14px;max-width:92vw;overflow:auto;font-size:10px;line-height:1.5;color:#7dd3fc;' +
          'background:#0f141c;border:1px solid #232a35;border-radius:10px;padding:10px;text-align:left;direction:ltr;white-space:pre-wrap">' +
          diag.replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; }) +
          '</pre></div>';
      }, 14000);   // אחרי שרשת ההתאוששות ניסתה פעמיים (6s, 12s)
    })();
  </script>

  <div class="toast-wrap" id="toasts"></div>

  <div class="modal-back" id="modalBack">
    <div class="modal" id="modal"></div>
  </div>

  <!-- הגדרות. defer שומר על סדר הריצה אבל לא חוסם parsing של ה-HTML.
       onload/onerror מסמנים לרשת ההתאוששות אילו קבצים נטענו ואילו נכשלו. -->
  <script src="config.js?v=138" defer onload="__ugLoaded('config')" onerror="__ugFailed('config')"></script>
  <!-- לוגיקה -->
  <script src="assets/js/util.js?v=138" defer onload="__ugLoaded('util')" onerror="__ugFailed('util')"></script>
  <script src="assets/js/store.js?v=138" defer onload="__ugLoaded('store')" onerror="__ugFailed('store')"></script>
  <script src="assets/js/auth.js?v=138" defer onload="__ugLoaded('auth')" onerror="__ugFailed('auth')"></script>
  <script src="assets/js/notify.js?v=138" defer onload="__ugLoaded('notify')" onerror="__ugFailed('notify')"></script>
  <script src="assets/js/fcm.js?v=138" defer onload="__ugLoaded('fcm')" onerror="__ugFailed('fcm')"></script>
  <script src="assets/js/email.js?v=138" defer onload="__ugLoaded('email')" onerror="__ugFailed('email')"></script>
  <script src="assets/js/app.js?v=138" defer onload="__ugLoaded('app')" onerror="__ugFailed('app')"></script>
  <!-- qrcode.js (~57KB) נטען רק כשצריך אותו — בעמוד "פרסום" של הבעלים. -->
  <script>
    (function(){
      window.UG = window.UG || {};
      var loading = null;
      UG.loadQrCode = function(){
        if (typeof qrcode !== "undefined") return Promise.resolve();
        if (loading) return loading;
        loading = new Promise(function(res, rej){
          var s = document.createElement("script");
          s.src = "assets/js/qrcode.js?v=99";
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
        return loading;
      };
    })();
  </script>
</body>
</html>
