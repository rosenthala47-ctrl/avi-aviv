[project]
name = "crr"
version = "0.1.0"
description = "Hybrid ML + LLM customer risk rating engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    # crr.screening: sanctions/PEP watchlist parsing (XXE-safe XML) and
    # matching (name-similarity scoring tuned for real-world name variants).
    "defusedxml>=0.7",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
# Phases 1-2 need the core dependencies above. These arrive with later phases.
model = ["shap>=0.45", "pyarrow>=15.0"]
# The API and SQLAlchemy are core (above). These are the production extras.
db = ["alembic>=1.13", "psycopg[binary]>=3.1", "redis>=5.0"]
# Phase 7: only needed for the real Anthropic-backed extractor. The reference
# extractor (default, tests, CI) has no dependency on this at all.
llm = ["anthropic>=0.40"]
# The Streamlit UI (app.py). A pure HTTP client of the API, so nothing in the
# library imports it and the service runs without any of this installed.
frontend = ["streamlit>=1.40", "plotly>=5.20", "requests>=2.31"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
# 140 rather than 120: this codebase is dense with numeric expressions and
# structural-equation coefficients that read worse split across lines.
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query() in argument
# defaults on purpose; these are not the mutable-default bug B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Pure data tables. The phrase banks (including RTL Hebrew, where character count
# and visual width diverge) and the column dictionary are more readable as one
# entry per line than wrapped to fit a column limit.
"src/crr/data/narratives.py" = ["E501"]
"src/crr/data/dictionary.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
