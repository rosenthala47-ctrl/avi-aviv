# Example proposed policy for scripts/simulate_policy.py.
#
# A COPY of risk_policy.yaml with one change: KYC_REFRESH_OVERDUE tightened
# from 180 to 90 days. This is the file to try first:
#
#   python scripts/simulate_policy.py \
#       --proposed config/risk_policy_proposed.example.yaml
#
# To make a real proposal: copy risk_policy.yaml, edit it, bump 'version',
# simulate it, and once satisfied, replace the live risk_policy.yaml with it
# (the loader archives every version it ever sees, so nothing is lost).

version: 2
effective_from: 2026-01-01
bands:
  Low:
    max_score: 25
  Medium:
    max_score: 50
  High:
    max_score: 75
  Extreme:
    max_score: 100
composite:
  credit_weight: 0.6
  financial_crime_weight: 0.4
  score_exponent: 0.45
rules:
- id: SANCTIONS_MATCH
  description: Any unresolved sanctions-list match is Extreme, regardless of model
    output.
  when: sanctions_screen_hits > 0
  action:
    floor_band: Extreme
    require_review: true
    reason_code: AML-001
    customer_visible: false
  enabled: true
- id: PEP_HIGH_RISK_JURISDICTION
  description: A politically exposed person operating from a high-risk jurisdiction.
  when: pep_flag == 1 and high_risk_jurisdiction_exposure == 1
  action:
    floor_band: High
    require_review: true
    reason_code: AML-002
    customer_visible: false
  enabled: true
- id: UNVERIFIED_SOURCE_OF_FUNDS
  description: Source of funds requiring EDD that remains unevidenced.
  when: source_of_funds_declared in ['undeclared','gift','crypto_disposal'] and source_of_funds_verified
    == 0
  action:
    floor_band: High
    require_review: true
    reason_code: AML-003
    customer_visible: false
  enabled: true
- id: KYC_REFRESH_OVERDUE
  description: Periodic KYC review overdue (tightened from 180 to 90 days).
  when: kyc_refresh_overdue_days > 90
  action:
    floor_band: Medium
    require_review: true
    reason_code: KYC-001
  enabled: true
- id: SEVERE_ARREARS
  description: Currently 90+ days past due.
  when: max_days_past_due_24m >= 90 and months_since_last_delinquency <= 3
  action:
    floor_band: High
    require_review: false
    reason_code: CR-001
  enabled: true
- id: THIN_FILE_HIGH_EXPOSURE
  description: New relationship drawing most of a large limit.
  when: account_age_months < 6 and credit_utilization_ratio > 0.8
  action:
    floor_band: Medium
    require_review: false
    reason_code: CR-002
  enabled: true
review:
  require_for_bands:
  - High
  - Extreme
rescoring:
  triggers:
  - event_type: missed_payment
    debounce_minutes: 0
  - event_type: overdraft_breach
    debounce_minutes: 60
  - event_type: chargeback
    debounce_minutes: 60
  - event_type: cash_deposit
    min_amount: 50000
    debounce_minutes: 15
  - event_type: wire_transfer_out
    min_amount: 100000
    debounce_minutes: 15
  - event_type: crypto_transfer
    min_amount: 25000
    debounce_minutes: 15
  max_score_age_days: 90
  notify_on_band_change_only: true
explainability:
  top_factors: 5
  min_absolute_shap: 0.01
  suppress_from_customer_view:
  - pep_flag
  - sar_filed_prior
  - adverse_media_hits_12m
  - sanctions_screen_hits
feedback:
  min_labelled_cases_before_retrain: 500
  retrain_schedule: monthly
  promotion_min_auc_gain: 0.005
  require_human_approval: true
