# Customer Risk Rating — nginx reverse proxy in front of Streamlit and the
# auth gateway (crr.workflow.gateway). See deploy/Caddyfile's header comment
# for why a reverse proxy is the productionised auth story here at all.
#
# Usage (local binary, no docker-compose):
#   nginx -c "$(pwd)/deploy/nginx.conf" -p "$(pwd)"
#   # then replace the "streamlit"/"gateway" upstream hosts below with
#   # 127.0.0.1 — those hostnames are Docker Compose service names, resolved
#   # automatically only inside that network (see docker-compose.yml).
#
# TLS: this file listens on plain HTTP only, deliberately, so it runs as-is
# for local testing. For production, terminate TLS here with a second
# `listen 443 ssl;` server block and your certificate (or, simpler to operate,
# use deploy/Caddyfile instead, which provisions and renews one automatically
# for a real domain). Either way, CRR_COOKIE_SECURE must stay at its default
# (true) once TLS is in front — a `Secure` cookie is never sent back by the
# browser over plain HTTP, so local testing over HTTP needs
# CRR_COOKIE_SECURE=false on the gateway (see the README).

worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       mime.types;
	default_type  application/octet-stream;
	sendfile      on;

	# The standard nginx WebSocket-upgrade helper: nginx does not forward the
	# Upgrade/Connection headers to the upstream on its own the way Caddy
	# does, so this maps $http_upgrade ("websocket" on Streamlit's runtime
	# connection, empty on an ordinary request) to the Connection header value
	# nginx must send upstream for the upgrade to actually happen.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	upstream streamlit_app {
		server streamlit:8501;
	}

	upstream auth_gateway {
		server gateway:8600;
	}

	server {
		listen 80;
		server_name localhost;

		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		# The auth gateway: the only service in this system allowed to issue
		# the httpOnly session cookie.
		location /auth/ {
			proxy_pass http://auth_gateway;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /healthz {
			proxy_pass http://auth_gateway;
		}

		# Everything else: the Streamlit app, including its WebSocket runtime
		# connection — proxy_read_timeout is raised well past nginx's 60s
		# default so an idle session's socket is not dropped out from under it.
		location / {
			proxy_pass http://streamlit_app;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 86400;
		}
	}
}
